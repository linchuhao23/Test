name: Daily AI News Mail

on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-ai-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate and send AI news email
        env:
          # Use a token from a Copilot-enabled account.
          GH_TOKEN: ${{ secrets.COPILOT_GH_TOKEN }}
          NEWS_LANG: ${{ vars.NEWS_LANG }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          EMAIL_FROM: ${{ secrets.MAIL_FROM }}
          EMAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.MAIL_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.MAIL_USER }}
          SMTP_PASSWORD: ${{ secrets.MAIL_PASS }}
          # true => SMTP + STARTTLS (default 587), false => SMTPS/SSL (default 465)
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
        run: python .github/scripts/daily_ai_news.py
